<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebar Control Board — Visavapat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Noto+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1b2a;--ink2:#152739;--paper:#eef1f4;--card:#fff;--line:#d7dee6;--steel:#1f6f9f;--steel-d:#134866;--rust:#c2571a;
--done:#1f9d6b;--overdue:#d5404b;--due:#d99a12;--upcoming:#8a97a6;--muted:#5f6f7e;--side:#0e1b2a;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai','Archivo',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* ===== SIDEBAR ===== */
.side{background:var(--side);color:#cfe0ee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-top{padding:22px 20px 16px;border-bottom:1px solid #24384c}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;background:var(--done);border-radius:6px;display:grid;place-items:center;font-family:'Archivo';font-weight:800;color:#fff;font-size:18px;flex-shrink:0}
.brand h1{font-family:'Archivo';font-weight:800;font-size:16px;color:#fff;line-height:1.15}
.brand .sub{font-size:10.5px;color:#7d94a8;margin-top:2px}
.nav{padding:12px 10px;flex:1}
.nav-label{font-size:10.5px;color:#5f7488;text-transform:uppercase;letter-spacing:.6px;padding:12px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#cfe0ee;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:background .12s}
.nav-item:hover{background:#1b2f42}
.nav-item.active{background:var(--steel);color:#fff;font-weight:700}
.nav-item .ic{width:18px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--overdue);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;font-family:'IBM Plex Mono'}
.nav-item.proj{font-size:13px}
.nav-item.proj .lotc{margin-left:auto;font-size:11px;color:#7d94a8;font-family:'IBM Plex Mono'}
.nav-item.proj.active .lotc{color:#cfe0ee}
.side-foot{padding:12px 16px;border-top:1px solid #24384c;font-size:11px;color:#7d94a8}
.side-foot .stat{display:flex;align-items:center;gap:7px}
.led{width:8px;height:8px;border-radius:50%;background:var(--upcoming);flex-shrink:0}
.led.ok{background:var(--done);box-shadow:0 0 6px var(--done)}.led.err{background:var(--overdue)}.led.load{background:var(--due);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* ===== MAIN ===== */
.main{padding:26px 32px 60px;max-width:1100px}
.phead{margin-bottom:20px}
.phead h2{font-family:'Archivo';font-weight:800;font-size:22px;letter-spacing:-.4px}
.phead .d{font-size:13px;color:var(--muted);margin-top:3px}
.page{display:none}.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--steel)}
.kpi.risk::before{background:var(--overdue)}.kpi.due::before{background:var(--due)}.kpi.ok::before{background:var(--done)}
.kpi .n{font-family:'Archivo';font-weight:800;font-size:32px;line-height:1;letter-spacing:-1px}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.risk .n{color:var(--overdue)}.kpi.due .n{color:var(--due)}.kpi.ok .n{color:var(--done)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.card h3{font-family:'Archivo';font-weight:800;font-size:15px;margin-bottom:3px}.card .cs{font-size:12px;color:var(--muted);margin-bottom:15px}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:13px}
.legend span{display:flex;align-items:center;gap:6px}.dot{width:11px;height:11px;border-radius:3px}
.d-done{background:var(--done)}.d-overdue{background:var(--overdue)}.d-due{background:var(--due)}.d-up{background:var(--upcoming)}
.prow{display:grid;grid-template-columns:150px 1fr 60px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.prow:first-of-type{border-top:none}.prow:hover .pname{color:var(--steel)}
.pname{font-weight:700;font-size:14px}.pname small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.bar{height:22px;border-radius:5px;overflow:hidden;display:flex;background:#eef1f4}.bar>i{height:100%}.pct{text-align:right;font-family:'IBM Plex Mono';font-weight:500;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700}
td{padding:9px 10px;border-bottom:1px solid #eaeef2;vertical-align:middle}tr:hover td{background:#f7f9fb}
.lotn{font-family:'IBM Plex Mono';font-weight:500;color:var(--steel-d)}
.stg{display:inline-flex;flex-direction:column;gap:2px;min-width:96px}.stg b{font-size:11px;padding:3px 8px;border-radius:5px;text-align:center;font-weight:600}
.stg small{font-size:10.5px;color:var(--muted);text-align:center;font-family:'IBM Plex Mono'}
.s-done{background:#e4f5ee;color:var(--done)}.s-overdue{background:#fbe6e8;color:var(--overdue)}.s-due{background:#fdf3e0;color:#a9760a}.s-up{background:#eef1f4;color:var(--muted)}
.master{font-family:'IBM Plex Mono';font-weight:500}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pill.od{background:#fbe6e8;color:var(--overdue)}.pill.dz{background:#fdf3e0;color:#a9760a}
.basis{font-size:11px;color:var(--muted)}
.pchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pchip{font-size:12px;padding:4px 11px;border-radius:20px;font-weight:600}
.pchip.done{background:#e4f5ee;color:var(--done)}.pchip.overdue{background:#fbe6e8;color:var(--overdue)}.pchip.due{background:#fdf3e0;color:#a9760a}.pchip.up{background:#eef1f4;color:var(--muted)}
.mtopbtn{display:none}
@media(max-width:780px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;width:250px;z-index:100;transition:left .25s;box-shadow:2px 0 20px rgba(0,0,0,.3)}
  .side.open{left:0}.mtopbtn{display:inline-flex;position:fixed;top:12px;left:12px;z-index:90;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:18px;cursor:pointer}
  .main{padding:60px 16px 40px}.kpis{grid-template-columns:repeat(2,1fr)}.prow{grid-template-columns:110px 1fr 44px}.stg{min-width:74px}
}
</style></head><body>

</div>

function parse(d){if(!d)return null;const m=String(d).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function fmt(d){return d?d.toISOString().slice(0,10):'-';}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}

function serial(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+v*DAY).toISOString().slice(0,10);return v;}
function serialD(v){if(v==null||v==='')return null;v=serial(v);const d=new Date(v);return isNaN(d)?String(v):d.toISOString().slice(0,10);}
const STAGE_KEY={'Barcut Preparation':'BarcutSubmit','Engineering Review':'EngReview','Procurement':'Procurement','Vendor Delivery':'VendorDelivery'};
function normalize(raw){
  // รองรับทั้งแบบเดิม (array) และแบบใหม่ {plan, actualLog}
  let plan, log;
  if(raw && raw.plan){ plan=raw.plan; log=raw.actualLog||[]; }
  else if(Array.isArray(raw)){ if(raw.length&&raw[0].stages)return raw; plan=raw; log=[]; }
  else { plan=raw.data||raw.body||[]; log=[]; }

  // สร้าง map ของ actual ล่าสุดต่อ (โครงการ|LOT|Stage) จาก ActualLog
  const norm=s=>String(s||'').toUpperCase().replace(/\s+/g,'');
  const actMap={};
  (log||[]).forEach(r=>{
    if(r.LOT==null||String(r.LOT).trim()==='')return;
    const sk=STAGE_KEY[r.Stage]||r.Stage;
    const k=norm(r.Project)+'|'+String(r.LOT).trim()+'|'+sk;
    const d=serialD(r.ActualDate);
    if(!d)return;
    // เก็บวันที่ล่าสุด (actual ล่าสุด)
    if(!actMap[k]||d>actMap[k]) actMap[k]=d;
  });

  const rows=(plan||[]).filter(r=>r.LOT!=null).map(r=>{
    const proj=r['Project name']||r.Project||'';
    const mk=sk=>{ const k=norm(proj)+'|'+String(r.LOT).trim()+'|'+sk; return actMap[k]||null; };
    return {lot:r.LOT,project:proj,desc:r.Description||'',
      stages:[
        {key:'BarcutSubmit',label:'Barcut',plan:serialD(r.BarcutSubmit_Plan),actual:mk('BarcutSubmit')},
        {key:'EngReview',label:'Eng Review',plan:serialD(r.EngReview_Plan),actual:mk('EngReview')},
        {key:'Procurement',label:'Procurement',plan:serialD(r.Procurement_Plan),actual:mk('Procurement')},
        {key:'VendorDelivery',label:'Vendor',plan:serialD(r.VendorDelivery_Plan),actual:mk('VendorDelivery')}],
      master:serialD(r.MasterPlan),key:r.Key};
  }).filter(x=>String(x.project||'').trim()!==''&&x.lot!=null);
  return rows;
}

function buildAlerts(){
  const od=[],dz=[];
  DATA.forEach(r=>{for(let i=0;i<r.stages.length;i++){const s=r.stages[i];if(s.actual)continue;
    let effDue,basis;
    if(i===0){effDue=parse(s.plan);basis='ตามแผน';}
    else{const prev=r.stages[i-1];if(!prev.actual)continue;const pd=parse(prev.actual);
      effDue=pd?addDays(pd,STAGE_DAYS[s.label]||5):parse(s.plan);basis=`งานก่อนหน้าเสร็จ ${prev.actual} +${STAGE_DAYS[s.label]||5} วัน`;}
    if(!effDue)continue;const dl=Math.round((effDue-AS_OF)/DAY);
    const it={project:r.project,lot:r.lot,desc:r.desc,stage:s.label,due:fmt(effDue),dl,basis};
    if(dl<0)od.push(it);else if(dl<=3)dz.push(it);}});
  od.sort((a,b)=>a.dl-b.dl);dz.sort((a,b)=>a.dl-b.dl);return{od,dz};
}

  const body=rows.map(r=>{const cell=s=>{const st=status(s);const v=s.actual?('✓ '+s.actual):(s.plan||'-');return `<td><div class="stg"><b class="s-${st}">${LB[st]}</b><small>${v}</small></div></td>`;};
    return `<tr><td class="lotn">LOT ${r.lot}</td><td>${r.desc||''}</td>${r.stages.map(cell).join('')}<td class="master">${r.master||'-'}</td></tr>`;}).join('');
  return `${chips}<div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>LOT</th><th>รายละเอียด</th><th>Barcut</th><th>Eng Review</th><th>Procurement</th><th>Vendor</th><th>Master Plan</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
// ===== nav + render =====
const TITLES={alert:['แจ้งเตือน','งานที่เลยกำหนดหรือใกล้ถึงกำหนด — อัปเดตอัตโนมัติทุก 60 วินาที'],
  overview:['ภาพรวมทุกโครงการ','สถานะรวมของทุกโครงการและทุกขั้นตอน'],
  dept:['สรุปแผนก','ความคืบหน้าและงานคงเหลือของแต่ละแผนก']};
function renderNavProjects(){
  const byProj={};DATA.forEach(r=>{byProj[r.project]=(byProj[r.project]||0)+1;});
  const projects=Object.keys(byProj).sort();
  document.getElementById('projNav').innerHTML=projects.map(p=>
    `<button class="nav-item proj" data-v="proj:${p}"><span class="ic">◆</span>${p}<span class="lotc">${byProj[p]}</span></button>`).join('');
  bindNav();
}
function render(){
  let title,desc,body;
  if(VIEW.startsWith('proj:')){const p=VIEW.slice(5);title=p;desc='รายละเอียดทุก LOT และขั้นตอนของโครงการ';body=viewProject(p);}
  else{[title,desc]=TITLES[VIEW]||['',''];body=VIEW==='alert'?viewAlert():VIEW==='overview'?viewOverview():viewDept();}
  document.getElementById('pTitle').textContent=title;
  document.getElementById('pDesc').textContent=desc;
  document.getElementById('content').innerHTML=body;
  // badge
  const {od}=buildAlerts();const b=document.getElementById('navBadge');
  if(od.length){b.style.display='';b.textContent=od.length;}else b.style.display='none';
  // active state
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.v===VIEW));
}
function go(v){VIEW=v;render();document.getElementById('side').classList.remove('open');}
function bindNav(){document.querySelectorAll('.nav-item').forEach(n=>{n.onclick=()=>go(n.dataset.v);});}
function renderAll(){renderNavProjects();render();}
// ===== fetch every 10s =====
function setLed(c,t){document.getElementById('led').className='led '+c;if(t)document.getElementById('ledTxt').textContent=t;}
async function loadData(){
  setLed('load','กำลังอัปเดต...');
  try{const res=await fetch(API_URL,{cache:'no-store'});if(!res.ok)throw 0;const raw=await res.json();const n=normalize(raw);
    if(!n.length)throw 0;DATA=n;renderAll();
    setLed('ok','อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(e){DATA=SAMPLE.filter(x=>String(x.project||'').trim()!==''&&x.lot!=null);renderAll();setLed('err','ใช้ข้อมูลตัวอย่าง');}
}
document.getElementById('mtoggle').onclick=()=>document.getElementById('side').classList.toggle('open');
bindNav();renderAll();loadData();
setInterval(loadData,60000);
</script></body></html>
